<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Regalos</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:30px;
}

button{
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
}

.seccion{
    display:none;
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input{
    width:70%;
    padding:10px;
}

ul{
    list-style:none;
    padding:0;
}

li{
    background:#ececec;
    margin:8px 0;
    padding:10px;
    border-radius:5px;
}

</style>
</head>
<body>

<h1>Lista de Regalos</h1>

<button onclick="mostrar('sandra')">Sandra</button>
<button onclick="mostrar('giovanni')">Giovanni</button>

<div id="sandra" class="seccion">
    <h2>Lista de Sandra</h2>

    <input type="text" id="textoSandra" placeholder="Añadir regalo">
    <button onclick="agregar('textoSandra','listaSandra')">Añadir</button>

    <ul id="listaSandra"></ul>
</div>

<div id="giovanni" class="seccion">
    <h2>Lista de Giovanni</h2>

    <input type="text" id="textoGiovanni" placeholder="Añadir regalo">
    <button onclick="agregar('textoGiovanni','listaGiovanni')">Añadir</button>

    <ul id="listaGiovanni"></ul>
</div>

<script>

function mostrar(persona){

    document.getElementById("sandra").style.display="none";
    document.getElementById("giovanni").style.display="none";

    document.getElementById(persona).style.display="block";
}

function agregar(inputId, listaId){

    let texto = document.getElementById(inputId).value;

    if(texto.trim() === ""){
        return;
    }

    let li = document.createElement("li");
    li.textContent = texto;

    document.getElementById(listaId).appendChild(li);

    document.getElementById(inputId).value = "";
}

</script>

</body>
</html>
