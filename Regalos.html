<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Regalos</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background:#f5f5f5;
        padding:30px;
    }

    .contenedor{
        max-width:900px;
        margin:auto;
    }

    h1{
        text-align:center;
        margin-bottom:30px;
    }

    .secciones{
        display:flex;
        gap:20px;
        flex-wrap:wrap;
    }

    .caja{
        flex:1;
        min-width:300px;
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h2{
        margin-bottom:15px;
    }

    input{
        width:100%;
        padding:10px;
        margin-bottom:10px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    button{
        width:100%;
        padding:10px;
        border:none;
        background:#333;
        color:white;
        border-radius:5px;
        cursor:pointer;
    }

    button:hover{
        background:#555;
    }

    ul{
        list-style:none;
        margin-top:15px;
    }

    li{
        background:#f0f0f0;
        padding:10px;
        margin-bottom:8px;
        border-radius:5px;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .eliminar{
        background:red;
        color:white;
        border:none;
        padding:5px 8px;
        border-radius:4px;
        cursor:pointer;
    }
</style>
</head>

<body>

<div class="contenedor">

    <h1>Lista de Cosas que Queremos</h1>

    <div class="secciones">

        <div class="caja">
            <h2>Mis ideas</h2>

            <input type="text" id="miIdea" placeholder="Añadir algo...">

            <button onclick="agregar('misDeseos','miIdea')">
                Añadir
            </button>

            <ul id="misDeseos"></ul>
        </div>

        <div class="caja">
            <h2>Sus ideas</h2>

            <input type="text" id="suIdea" placeholder="Añadir algo...">

            <button onclick="agregar('susDeseos','suIdea')">
                Añadir
            </button>

            <ul id="susDeseos"></ul>
        </div>

    </div>

</div>

<script>

function agregar(listaID, inputID){

    const input = document.getElementById(inputID);
    const texto = input.value.trim();

    if(texto === ""){
        return;
    }

    const li = document.createElement("li");

    li.innerHTML =
        texto +
        '<button class="eliminar" onclick="this.parentElement.remove()">X</button>';

    document.getElementById(listaID).appendChild(li);

    input.value = "";
}

</script>

</body>
</html>
