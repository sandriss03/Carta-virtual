<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideas para regalos</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #f7f7f7, #dcdcdc);
    text-align: center;
    padding: 30px;
    margin: 0;
}

button{
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background-color: #385898;
    color: white;
    cursor: pointer;
}

.seccion{
    display: none;
    max-width: 500px;
    margin: 20px auto;
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

input{
    width: 70%;
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

ul{ list-style: none; padding: 0; }

li{
    background: #f5f5f5;
    margin: 8px 0;
    padding: 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

li img{
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 8px;
}

.borrar{
    background-color: #c0392b;
}
</style>
</head>

<body>

<h1>Ideas para regalos</h1>

<button onclick="mostrar('sandra')">Sandra</button>
<button onclick="mostrar('giovanni')">Giovanni</button>

<div id="sandra" class="seccion">
<h2>Sandra</h2>
<input id="textoSandra" placeholder="Texto">
<input type="file" id="imgSandra" accept="image/*">
<button onclick="añadirSandra()">Añadir</button>
<ul id="listaSandra"></ul>
</div>

<div id="giovanni" class="seccion">
<h2>Giovanni</h2>
<input id="textoGiovanni" placeholder="Texto">
<input type="file" id="imgGiovanni" accept="image/*">
<button onclick="añadirGiovanni()">Añadir</button>
<ul id="listaGiovanni"></ul>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "TU_API_KEY",
authDomain: "TU_AUTH_DOMAIN",
projectId: "TU_PROJECT_ID",
storageBucket: "TU_STORAGE_BUCKET",
messagingSenderId: "TU_SENDER_ID",
appId: "TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.mostrar = (id) => {
document.getElementById("sandra").style.display = "none";
document.getElementById("giovanni").style.display = "none";
document.getElementById(id).style.display = "block";
};

function toBase64(file){
return new Promise(resolve=>{
const r = new FileReader();
r.onload = () => resolve(r.result);
r.readAsDataURL(file);
});
}

async function add(usuario, texto, file){

if(texto.trim()=="" && !file) return;

let img = "";
if(file) img = await toBase64(file);

await addDoc(collection(db,"lista"),{
usuario,
texto,
img
});
}

window.añadirSandra = async () => {
await add(
"sandra",
document.getElementById("textoSandra").value,
document.getElementById("imgSandra").files[0]
);

document.getElementById("textoSandra").value="";
document.getElementById("imgSandra").value="";
};

window.añadirGiovanni = async () => {
await add(
"giovanni",
document.getElementById("textoGiovanni").value,
document.getElementById("imgGiovanni").files[0]
);

document.getElementById("textoGiovanni").value="";
document.getElementById("imgGiovanni").value="";
};

window.borrar = async (id)=>{
await deleteDoc(doc(db,"lista",id));
};

function render(){
onSnapshot(collection(db,"lista"),(snap)=>{
document.getElementById("listaSandra").innerHTML="";
document.getElementById("listaGiovanni").innerHTML="";

snap.forEach(d=>{
const x = d.data();

const html =
`<li>
${x.img ? `<img src="${x.img}">` : ""}
<span>${x.texto}</span>
<button class="borrar" onclick="borrar('${d.id}')">X</button>
</li>`;

if(x.usuario==="sandra"){
document.getElementById("listaSandra").innerHTML+=html;
}else{
document.getElementById("listaGiovanni").innerHTML+=html;
}
});
});
}

render();
</script>

</body>
</html>
